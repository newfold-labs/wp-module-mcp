name: Dependabot Auto-Merge
on:
  workflow_run:
    workflows:
      - Lint
      - Codecoverage-Main
      - Build and Test Module Updates in Brand Plugins (Playwright tests)
    types: [completed]

# Serialize firings per PR so two CI workflows finishing in parallel do not race
# each other to the merge step. cancel-in-progress is false because cancelling a
# run mid-merge could leave the PR approved-but-not-merged. The fallback to
# workflow_run.id covers events where pull_requests is empty (push to default
# branch, fork PR) — the job's `if:` filter rejects those anyway.
concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  # Delegates to the central reusable workflow in newfold-labs/workflows.
  # workflow_run runs from the default-branch workflow file (no PR code checkout
  # required), so GITHUB_TOKEN has write scope. The reusable workflow re-checks
  # all check runs for the head SHA before merging — this gate replaces native
  # auto-merge so the merge is held back when CI fails, even when branch protection
  # has no required status checks configured.
  dependabot-auto-merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: newfold-labs/workflows/.github/workflows/reusable-dependabot-auto-merge.yml@enhance/PRESS0-4266
    permissions:
      contents: write      # Required by the reusable workflow to merge the Dependabot pull request into the base branch.
      pull-requests: write # Required by the reusable workflow to read or update the Dependabot PR before merging.
    with:
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
    timeout-minutes: 30
