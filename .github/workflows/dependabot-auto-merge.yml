name: Dependabot Auto-Merge
on:
  workflow_run:
    workflows:
      - Lint
      - Codecoverage-Main
      - Build and Test Module Updates in Brand Plugins (Playwright tests)
    types: [completed]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured individually for each job.
permissions: {}

jobs:
  # Delegates to the central reusable workflow in newfold-labs/workflows.
  # workflow_run runs from the default-branch workflow file (no PR code checkout
  # required), so GITHUB_TOKEN has write scope. The reusable workflow re-checks
  # all check runs for the head SHA before merging — this gate replaces native
  # auto-merge so the merge is held back when CI fails, even when branch protection
  # has no required status checks configured.
  auto-merge:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: newfold-labs/workflows/.github/workflows/reusable-dependabot-auto-merge.yml@enhance/PRESS0-4266
    with:
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
