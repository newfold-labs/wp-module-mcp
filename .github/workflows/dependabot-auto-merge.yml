name: Dependabot Auto-Merge
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# One run per PR; let in-flight runs finish so we never leave a PR approved
# without auto-merge armed (each run is ~15 seconds, so parallel dup runs are cheap).
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured individually for each job.
permissions: {}

jobs:
  # Delegates to the central reusable workflow in newfold-labs/workflows.
  # pull_request_target is required so GITHUB_TOKEN has write scope for Dependabot PRs.
  # No PR code is checked out — this workflow only acts on PR metadata via the GitHub API.
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: newfold-labs/workflows/.github/workflows/reusable-dependabot-auto-merge.yml@main
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
