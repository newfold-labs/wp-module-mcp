name: Dependabot Auto-Merge
on:
  schedule:
    # Twice a day (06:00 and 18:00 UTC). The sweep is cheap; the second run just
    # lowers the latency before a freshly-green or freshly-rebased PR is merged.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would be merged without merging.
        type: boolean
        default: false

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured individually for each job.
permissions: {}

jobs:
  # Delegates to the central reusable workflow in newfold-labs/workflows.
  # It discovers every open Dependabot PR on a schedule and merges the eligible
  # ones (not draft, mergeable, all check runs green, an opted-in bump type), so
  # the merge is held back when CI fails even when branch protection has no
  # required status checks configured. Majors are left for a human.
  #
  # NOTE: pinned to the feature branch until the workflows change lands on main;
  # bump to a tagged ref / commit SHA on @main afterwards.
  auto-merge:
    name: Auto-merge Dependabot PRs
    uses: newfold-labs/workflows/.github/workflows/reusable-dependabot-auto-merge.yml@enhance/PRESS0-4266
    with:
      merge-method: squash
      update-types: patch,minor
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
    # checks: read lets the reusable read check-run status via the Checks API.
    # GITHUB_TOKEN reaches the called workflow automatically — no secrets: inherit.
    permissions:
      contents: write
      pull-requests: write
      checks: read
