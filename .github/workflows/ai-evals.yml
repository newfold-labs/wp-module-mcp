name: MCP AI Evals

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches:
      - main
    paths:
      - 'includes/Abilities/**'
      - 'evals/**'
      - '.github/workflows/ai-evals.yml'
      - '.wp-env.json'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model to use for evals (e.g. openai/gpt-4o-mini, openai/gpt-4o)'
        required: false
        default: 'openai/gpt-4o-mini'
        type: string
      run_all:
        description: 'Run all test cases (ignore file change filtering)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  ai-eval:
    name: AI Tool Selection Eval
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CF_AI_GATEWAY_URL: 'https://gateway.ai.cloudflare.com/v1/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/${{ vars.CLOUDFLARE_AI_GATEWAY_ID }}/compat/chat/completions'
      MODEL: ${{ inputs.model || 'openai/gpt-4o-mini' }}
      MCP_EVAL_SERVER_URL: 'http://localhost:8888/index.php?rest_route=/blu/mcp'
      MCP_EVAL_NAMESPACE: 'blu'
      WP_EVAL_USER: admin
      MCP_ABILITY_NAMES_OUT: /tmp/mcp-ability-names.txt
      BRAND_PLUGIN_DIR: wp-plugin-bluehost

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Bluehost plugin
        uses: actions/checkout@v4
        with:
          repository: newfold-labs/wp-plugin-bluehost
          path: ${{ env.BRAND_PLUGIN_DIR }}
          persist-credentials: false

      - name: Detect changed ability files
        id: changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.run_all }}" == "true" ]]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            echo "Running all test cases (manual trigger with run_all=true)"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="HEAD~1"
            HEAD_SHA="HEAD"
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"..."$HEAD_SHA" -- includes/Abilities/ evals/ .github/workflows/ai-evals.yml .wp-env.json 2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "No ability or eval files changed. Skipping evals."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED_SOURCES=""
          while IFS= read -r file; do
            if [[ "$file" == includes/Abilities/*.php ]]; then
              CHANGED_SOURCES="$CHANGED_SOURCES $(basename "$file")"
            fi
          done <<< "$CHANGED_FILES"

          echo "changed_sources=$CHANGED_SOURCES" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Changed ability files: $CHANGED_SOURCES"

          EVALS_CHANGED=false
          while IFS= read -r file; do
            if [[ "$file" == evals/* ]] || [[ "$file" == .github/workflows/ai-evals.yml ]] || [[ "$file" == .wp-env.json ]]; then
              EVALS_CHANGED=true
              break
            fi
          done <<< "$CHANGED_FILES"

          if [ "$EVALS_CHANGED" = true ]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            echo "Eval files changed — running all test cases"
          else
            echo "run_all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure PHP and Composer availability
        if: steps.changes.outputs.skip != 'true'
        run: |
          if ! command -v php >/dev/null 2>&1; then
            echo "PHP not found. Installing from apt..."
            sudo apt-get update
            sudo apt-get install -y php-cli php-mbstring php-xml php-curl
          fi

          if ! command -v composer >/dev/null 2>&1; then
            echo "Composer not found. Installing from apt..."
            sudo apt-get update
            sudo apt-get install -y composer
          fi

          php -v
          composer --version

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            evals/package-lock.json

      - name: Install Bluehost plugin (Composer)
        if: steps.changes.outputs.skip != 'true'
        working-directory: ${{ env.BRAND_PLUGIN_DIR }}
        run: composer install --no-progress --no-dev --optimize-autoloader --prefer-dist

      - name: Install module dependencies (Composer)
        if: steps.changes.outputs.skip != 'true'
        run: composer install --no-progress --no-dev --optimize-autoloader --prefer-dist

      - name: Configure wp-env
        if: steps.changes.outputs.skip != 'true'
        run: |
          PLUGIN_DIR_NAME="$(basename "${{ env.BRAND_PLUGIN_DIR }}")"
          jq -n \
            --arg plugin "${{ github.workspace }}/${{ env.BRAND_PLUGIN_DIR }}" \
            --arg module "${{ github.workspace }}" \
            --arg plugin_dir "$PLUGIN_DIR_NAME" \
            '{
              plugins: [$plugin],
              mappings: {
                ("wp-content/plugins/" + $plugin_dir + "/vendor/newfold-labs/wp-module-mcp"): $module
              }
            }' > .wp-env.override.json
          cat .wp-env.override.json

      - name: Install wp-env
        if: steps.changes.outputs.skip != 'true'
        run: npm ci

      - name: Start WordPress (wp-env)
        if: steps.changes.outputs.skip != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          command: npx wp-env start

      - name: Activate Bluehost plugin
        if: steps.changes.outputs.skip != 'true'
        run: |
          PLUGINS=$(npx wp-env run cli wp plugin list --field=name)
          echo "Detected plugins:"
          echo "$PLUGINS"

          SLUG=$(echo "$PLUGINS" | awk '/^(wp-plugin-bluehost|bluehost-wordpress-plugin|wp-plugin-bluehost\/bluehost-wordpress-plugin\.php)$/{print; exit}')

          if [ -z "$SLUG" ]; then
            if echo "$PLUGINS" | awk '/bluehost/{found=1} END{exit !found}'; then
              SLUG=$(echo "$PLUGINS" | awk '/bluehost/{print; exit}')
            fi
          fi

          if [ -z "$SLUG" ]; then
            echo "::error::Unable to locate Bluehost plugin slug from wp plugin list output."
            exit 1
          fi

          echo "Activating plugin slug: $SLUG"
          npx wp-env run cli wp plugin activate "$SLUG"

      - name: Create application password
        if: steps.changes.outputs.skip != 'true'
        id: wp_auth
        run: |
          APP_PASS=$(npx wp-env run cli wp user application-password create "${WP_EVAL_USER}" ci-evals --porcelain)
          echo "::add-mask::${APP_PASS}"
          echo "WP_APP_PASSWORD=${APP_PASS}" >> "$GITHUB_ENV"
          echo "Application password created for user ${WP_EVAL_USER}"

      - name: Verify MCP endpoint
        if: steps.changes.outputs.skip != 'true'
        run: |
          INIT_BODY='{"jsonrpc":"2.0","id":"probe-init","method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"wp-module-mcp-evals-probe","version":"1.0.0"}}}'
          HTTP_CODE=$(curl -sS -o /tmp/mcp-probe.txt -w "%{http_code}" \
            -u "${WP_EVAL_USER}:${WP_APP_PASSWORD}" \
            -H "Accept: application/json, text/event-stream" \
            -H "Content-Type: application/json" \
            -d "${INIT_BODY}" \
            "${MCP_EVAL_SERVER_URL}" || true)

          echo "MCP probe HTTP status: ${HTTP_CODE}"
          if [ "${HTTP_CODE}" = "404" ] || [ "${HTTP_CODE}" = "401" ] || [ "${HTTP_CODE}" = "403" ] || [[ "${HTTP_CODE}" =~ ^5 ]]; then
            echo "::error::MCP endpoint probe failed with HTTP ${HTTP_CODE} at ${MCP_EVAL_SERVER_URL}"
            echo "Response body:"
            cat /tmp/mcp-probe.txt || true
            echo "Registered routes containing mcp (from WP runtime):"
            npx wp-env run cli wp eval 'echo implode("\n", array_filter(array_keys(rest_get_server()->get_routes()), function($r){ return false !== stripos($r, "mcp"); }));' || true
            exit 1
          fi

      - name: Install eval dependencies
        if: steps.changes.outputs.skip != 'true'
        working-directory: evals
        run: npm ci

      - name: Check tool coverage
        id: coverage
        if: steps.changes.outputs.skip != 'true'
        continue-on-error: true
        working-directory: evals
        env:
          COVERAGE_REPORT: ${{ github.workspace }}/coverage-report.md
        run: npm run coverage

      - name: Run AI evals
        if: steps.changes.outputs.skip != 'true'
        id: eval
        working-directory: evals
        env:
          CF_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_GATEWAY_TOKEN }}
          EVAL_REPORT: ${{ github.workspace }}/eval-report.md
          EVAL_RUN_ALL: ${{ steps.changes.outputs.run_all }}
          EVAL_CHANGED_SOURCES: ${{ steps.changes.outputs.changed_sources }}
        run: npm run run-evals

      - name: Combine reports
        if: always() && steps.changes.outputs.skip != 'true'
        run: |
          : > combined-report.md
          [ -f coverage-report.md ] && cat coverage-report.md >> combined-report.md
          [ -f eval-report.md ] && cat eval-report.md >> combined-report.md
          if [ ! -s combined-report.md ]; then
            echo "## :warning: MCP AI Eval did not produce a report" > combined-report.md
            echo "" >> combined-report.md
            echo "A previous step failed before coverage/eval reports were generated. Check workflow logs for details." >> combined-report.md
          fi
          cat combined-report.md

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.skip != 'true'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ai-eval-results
          path: combined-report.md

      - name: Upload eval report
        if: always() && steps.changes.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-eval-report
          path: combined-report.md

      - name: Check eval results
        if: steps.changes.outputs.skip != 'true'
        run: |
          FAIL=${{ steps.eval.outputs.fail || 0 }}
          ERROR=${{ steps.eval.outputs.error || 0 }}
          PASS_RATE=${{ steps.eval.outputs.pass_rate || 0 }}
          COVERAGE_FAIL=${{ steps.coverage.outputs.coverage_fail }}
          MISSING_TESTS=${{ steps.coverage.outputs.missing_tests }}
          MISSING_ON_MCP=${{ steps.coverage.outputs.missing_on_mcp }}

          EXIT_CODE=0

          if [ "$COVERAGE_FAIL" = "true" ]; then
            echo "::warning::Tool coverage gaps (non-blocking) — $MISSING_TESTS ability(s) missing test cases, $MISSING_ON_MCP ability(s) missing on MCP server."
          fi

          echo "Pass rate: ${PASS_RATE}%"

          if [ "$FAIL" -gt 0 ] || [ "$ERROR" -gt 0 ]; then
            echo "::error::AI eval failed — $FAIL test(s) failed, $ERROR error(s). Pass rate: ${PASS_RATE}%"
            EXIT_CODE=1
          fi

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "All AI evals passed!"
          fi

          exit $EXIT_CODE

      - name: wp-env debug log
        if: failure() && steps.changes.outputs.skip != 'true'
        continue-on-error: true
        run: npx wp-env run wordpress cat /var/www/html/wp-content/debug.log || true
