name: Check for Updates to Translations

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

# Cancels all previous workflow runs for the branch that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name.
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  translate:
    name: 'Check and update translations'
    permissions:
      contents: write      # Required by the reusable workflow to commit translation catalog updates on a branch (write implies read for checkout).
      pull-requests: write # Required by the reusable workflow to open or update translation pull requests.
    uses: newfold-labs/workflows/.github/workflows/reusable-translations.yml@main
    timeout-minutes: 45
    with:
      text_domain: 'wp-module-mcp'
    secrets:
      TRANSLATOR_API_KEY: ${{ secrets.TRANSLATOR_API_KEY }}
